name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    php:
        name: PHP tests and style
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: mbstring, pdo_sqlite, sqlite3
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Check PHP style
              run: vendor/bin/pint --test tests database

            - name: Run tests
              run: php artisan test

    frontend:
        name: Frontend checks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: mbstring, pdo_sqlite, sqlite3
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install pnpm dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Wayfinder routes
              run: php artisan wayfinder:generate

            - name: Typecheck
              run: pnpm typecheck

            - name: Run unit tests
              run: pnpm test

            - name: Build
              run: pnpm build
